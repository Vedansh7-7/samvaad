<!doctype html>
<!--
  Deploy entry: makes "/" work on Vercel.

  Routing, decided with the team on 2026-09-14:
  - Someone already signed in goes straight into the app. They have seen the intro and do not need
    to sign in again.
  - Everyone else (new, signed out, or a guest) lands on the intro, every time. There is no
    "seen it once" memory any more: the intro is skippable in one tap, and a remembered flag meant
    returning visitors, and the team, could never see it again.

  The meta-refresh and the <noscript> link point at the intro so the page is never a dead end with
  scripting off.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Vercel Web Analytics: cookieless page views, no consent banner needed -->
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments);};</script>
<script defer src="/_vercel/insights/script.js"></script>
<meta name="description" content="Samvaad helps you see a hard conversation clearly: upload it, get a calm score, watch the moment played back, and try kinder lines. Hinglish, Hindi and English.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#7164C6">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Samvaad">
<meta property="og:title" content="Samvaad · Understand your conversations">
<meta property="og:description" content="Samvaad helps you see a hard conversation clearly: upload it, get a calm score, watch the moment played back, and try kinder lines. Hinglish, Hindi and English.">
<meta property="og:url" content="https://samvaad-mu.vercel.app/">
<meta property="og:image" content="https://samvaad-mu.vercel.app/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Samvaad: see the conversation, not just the argument">
<meta name="twitter:card" content="summary_large_image">

  <title>Samvaad · Understand your conversations</title>
  <meta http-equiv="refresh" content="2; url=intro.html">
  <link rel="canonical" href="https://samvaad-mu.vercel.app/intro.html">
  <script src="auth.js"></script>
</head>
<body>
  <script>
    (function(){
      var signedIn = false;
      try {
        var s = window.SamvaadAuth && SamvaadAuth.readSession();
        // a session that has already expired is not "signed in"; app.html would bounce it anyway
        signedIn = !!(s && s.access_token && (!s.expires_at || s.expires_at * 1000 > Date.now()));
      } catch (e) {}
      location.replace(signedIn ? 'app.html' : 'intro.html');
    })();
  </script>
  <noscript><a href="intro.html">Continue to Samvaad</a></noscript>
</body>
</html>
