<!doctype html>
<!--
  Samvaad — Rive rig test harness (NOT part of the app).
  Purpose: drop in your exported .riv and verify BEFORE we touch app.html:
    1. Did the background stay OUT? (checkerboard shows through if transparent)
    2. Do the inputs respond?  expNum 0..8  (expressions),  phonemeNum 0..4 (mouth)
    3. What are the EXACT state-machine + input names? (printed in the log)
  Open this file directly in a browser, click "Load .riv", pick your file.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Samvaad · Rive rig test</title>
<script src="https://unpkg.com/@rive-app/canvas@2/rive.js"></script>
<style>
  :root{--cherry:#C8324B;--ink:#2E2024;--muted:#6E5258;}
  *{box-sizing:border-box}
  body{margin:0;font-family:Mulish,system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(160deg,#FDF3F2,#F1DDE8);min-height:100vh;padding:24px}
  h1{font-family:Fraunces,serif;font-weight:600;font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
  .wrap{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
  /* checkerboard reveals ANY exported background (transparent = you see the checkers) */
  .stage{width:320px;height:420px;border-radius:16px;overflow:hidden;
    background-image:
      linear-gradient(45deg,#ccc 25%,transparent 25%),
      linear-gradient(-45deg,#ccc 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#ccc 75%),
      linear-gradient(-45deg,transparent 75%,#ccc 75%);
    background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;
    box-shadow:0 10px 30px rgba(60,30,40,.15)}
  canvas{width:100%;height:100%;display:block}
  .panel{flex:1;min-width:280px;max-width:440px}
  .card{background:rgba(255,255,255,.6);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.7);
    border-radius:16px;padding:16px;margin-bottom:14px}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
  input[type=range]{width:100%}
  .val{font-weight:700;color:var(--cherry)}
  button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:9px 14px;
    background:var(--cherry);color:#fff;cursor:pointer}
  button.ghost{background:rgba(200,50,75,.12);color:var(--cherry)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .chip{font-size:11px;padding:4px 8px;border-radius:20px;background:rgba(200,50,75,.1);
    color:var(--cherry);cursor:pointer;border:0}
  pre{background:#1c1620;color:#e8dfe4;border-radius:12px;padding:12px;font-size:11px;
    line-height:1.5;overflow:auto;max-height:280px;white-space:pre-wrap;margin:0}
  .note{font-size:11px;color:var(--muted);margin-top:6px}
</style>

<h1>Samvaad · Rive rig test harness</h1>
<p class="sub">Verify the export before we integrate. Checkerboard = transparent (good). Watch the log for exact input names.</p>

<div class="wrap">
  <div class="stage"><canvas id="cv" width="640" height="840"></canvas></div>

  <div class="panel">
    <div class="card">
      <div class="row">
        <input type="file" id="file" accept=".riv" style="display:none">
        <button onclick="document.getElementById('file').click()">Load .riv</button>
        <button class="ghost" onclick="reload()">Reload</button>
      </div>
      <div class="note">Nothing is uploaded — the file is read locally in your browser.</div>
    </div>

    <div class="card">
      <label>expNum — expression <span class="val" id="expV">0</span></label>
      <input type="range" id="exp" min="0" max="8" step="1" value="0">
      <div class="chips">
        <button class="chip" data-e="0">0 idle</button>
        <button class="chip" data-e="1">1 thoughtful</button>
        <button class="chip" data-e="2">2 surprised</button>
        <button class="chip" data-e="3">3 angry</button>
        <button class="chip" data-e="4">4 sad</button>
        <button class="chip" data-e="5">5 happy</button>
        <button class="chip" data-e="6">6 confused</button>
        <button class="chip" data-e="7">7 annoyed</button>
        <button class="chip" data-e="8">8 empathy</button>
      </div>

      <label>phonemeNum — mouth <span class="val" id="phV">0</span></label>
      <input type="range" id="ph" min="0" max="4" step="1" value="0">
      <div class="chips">
        <button class="chip" data-p="0">0 b/m/p</button>
        <button class="chip" data-p="1">1 a/e/i</button>
        <button class="chip" data-p="2">2 oo</button>
        <button class="chip" data-p="3">3 aa</button>
        <button class="chip" data-p="4">4 f/v</button>
      </div>

      <label>Auto lip-flap test</label>
      <div class="row">
        <button class="ghost" id="flap">▶ flap mouth</button>
        <span class="note">cycles phonemes so you can eyeball the talk look</span>
      </div>
    </div>

    <div class="card">
      <label>Discovered contract (paste this back to Claude)</label>
      <pre id="log">No file loaded yet.</pre>
    </div>
  </div>
</div>

<script>
var riveIns=null, buf=null;
var SM_GUESS=['Expression','mouthOps'];  // confirmed from the .riv binaries
var log=function(s){document.getElementById('log').textContent=s;};

document.getElementById('file').addEventListener('change',function(e){
  var f=e.target.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){ buf=rd.result; boot(); };
  rd.readAsArrayBuffer(f);
});
function reload(){ if(buf) boot(); }

function boot(){
  if(riveIns){ try{riveIns.cleanup();}catch(_){} riveIns=null; }
  riveIns=new rive.Rive({
    buffer: buf,
    canvas: document.getElementById('cv'),
    autoplay: true,
    stateMachines: SM_GUESS,          // harmless if some don't exist
    autoBind: true,                   // also expose ViewModel data-binding if used
    onLoad: function(){
      riveIns.resizeDrawingSurfaceToCanvas();
      inspect();
      apply('exp'); apply('ph');
    },
    onLoadError: function(err){ log('Load error:\n'+err); }
  });
}

/* Print artboards -> state machines -> inputs, and any ViewModel props. */
function inspect(){
  var out=[];
  try{
    var c=riveIns.contents;
    if(c && c.artboards){
      c.artboards.forEach(function(ab){
        out.push('Artboard: "'+ab.name+'"');
        (ab.stateMachines||[]).forEach(function(sm){
          out.push('  SM: "'+sm.name+'"');
          (sm.inputs||[]).forEach(function(i){ out.push('     input: "'+i.name+'"  ('+i.type+')'); });
        });
      });
    }
  }catch(e){ out.push('(contents unavailable: '+e+')'); }
  // ViewModel (data-binding) probe
  try{
    var vmi=riveIns.viewModelInstance;
    if(vmi){ out.push('ViewModel instance: present (data-binding in use)'); }
  }catch(e){}
  out.push('\nSetters tried, in order: SM number input -> ViewModel number.');
  log(out.join('\n'));
}

/* Set a number on whichever mechanism the rig actually uses. */
function setNum(name,v){
  var done=false;
  // 1) classic state-machine number input
  SM_GUESS.forEach(function(sm){
    try{
      var ins=riveIns.stateMachineInputs(sm);
      if(ins) ins.forEach(function(i){ if(i.name===name){ i.value=v; done=true; } });
    }catch(_){}
  });
  // 2) ViewModel data-binding
  if(!done){
    try{ var vmi=riveIns.viewModelInstance; if(vmi){ vmi.number(name).value=v; done=true; } }catch(_){}
  }
  return done;
}

function apply(which){
  if(!riveIns) return;
  if(which==='exp'){ var v=+document.getElementById('exp').value; document.getElementById('expV').textContent=v; setNum('expNum',v); }
  else{ var p=+document.getElementById('ph').value; document.getElementById('phV').textContent=p; setNum('phonemeNum',p); }
}
document.getElementById('exp').addEventListener('input',function(){apply('exp');});
document.getElementById('ph').addEventListener('input',function(){apply('ph');});
document.querySelectorAll('[data-e]').forEach(function(b){b.onclick=function(){document.getElementById('exp').value=b.dataset.e;apply('exp');};});
document.querySelectorAll('[data-p]').forEach(function(b){b.onclick=function(){document.getElementById('ph').value=b.dataset.p;apply('ph');};});

// crude lip-flap so you can judge the talking look (engine will drive this for real later)
var flapT=null, seq=[1,3,2,1,4,0], fi=0;
document.getElementById('flap').onclick=function(){
  if(flapT){ clearInterval(flapT); flapT=null; this.textContent='▶ flap mouth'; setNum('phonemeNum',0); return; }
  this.textContent='■ stop';
  flapT=setInterval(function(){ setNum('phonemeNum',seq[fi%seq.length]); fi++; },140);
};
</script>
