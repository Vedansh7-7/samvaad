<!doctype html>
<!--
  Samvaad, Admin console (pre-launch trial).
  Two sides: Metrics (what the cohort is doing) and People (what you can do about it).
  Auth-gated: only Supabase users whose id is in the backend's ADMIN_USER_IDS see anything.
  Backend URL is read from localStorage 'samvaad.beUrl', else the Render default below.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#7164C6">
<title>Samvaad · Admin</title>
<script src="auth.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Nunito:wght@400;600;700;800&display=swap');
  :root{
    --ink:#312E52; --muted:#686586; --hair:rgba(49,46,82,.12);
    --glass:rgba(255,255,255,.78); --glass-2:rgba(255,255,255,.9); --glass-brd:rgba(214,211,227,.85);
    --cherry:#7164C6; --cherry-2:#5848BF;
    --good:#367D69; --warn:#98661B; --risk:#B0523B;
    --accent:#7164C6; --accent-soft:#E1DEF7; --accent-ink:#5848BF;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);font-family:'Nunito',system-ui,sans-serif;line-height:1.6;min-height:100vh;
    background:radial-gradient(120% 90% at 12% 6%,#F1F0F9 0%,rgba(241,240,249,0) 46%),
               radial-gradient(120% 100% at 92% 18%,#F4E9E1 0%,rgba(244,233,225,0) 50%),
               linear-gradient(160deg,#FAF8F4 0%,#F4F2F8 48%,#EFEDF7 100%);}
  .wrap{max-width:1080px;margin:0 auto;padding:26px 18px 80px}
  .serif{font-family:'Fraunces',serif}
  .glass{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.2);backdrop-filter:blur(20px) saturate(1.2);
    border:1px solid var(--glass-brd);border-radius:20px;box-shadow:0 20px 50px -30px rgba(49,46,82,.4),inset 0 1px 0 rgba(255,255,255,.55)}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .word{font-family:'Fraunces',serif;font-weight:600;font-size:22px}.word .d{color:var(--cherry)}
  .word .sub{font-size:13px;color:var(--muted);font-family:'Nunito';font-weight:600;margin-left:8px}
  .btn{border:none;border-radius:12px;padding:10px 18px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;color:#fff;
    background:linear-gradient(180deg,var(--cherry),var(--cherry-2));box-shadow:0 12px 24px -12px rgba(88,72,191,.55)}
  .btn.soft{background:var(--glass);color:var(--ink);border:1px solid var(--glass-brd);box-shadow:none;font-weight:600}
  .btn:disabled{opacity:.55;cursor:progress}
  .note{font-size:13.5px;color:var(--muted);margin:0}
  .gate{padding:30px;text-align:center}
  .gate h2{font-family:'Fraunces',serif;font-weight:500;margin:0 0 8px}
  .gate a{color:var(--accent-ink);font-weight:700}

  /* tabs */
  .tabs{display:inline-flex;gap:4px;padding:4px;border-radius:99px;background:var(--glass);border:1px solid var(--glass-brd);margin-bottom:18px}
  .tabs button{border:none;background:none;font:inherit;font-weight:700;font-size:13.5px;color:var(--muted);padding:8px 18px;border-radius:99px;cursor:pointer}
  .tabs button[aria-selected="true"]{background:linear-gradient(180deg,var(--cherry),var(--cherry-2));color:#fff}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:16px}
  .kpi{padding:15px 17px}
  .kpi .lab{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink)}
  .kpi .val{font-family:'Fraunces',serif;font-weight:600;font-size:32px;line-height:1.1;margin-top:2px}
  .kpi .hint{font-size:12.5px;color:var(--muted);margin-top:1px}
  .kpi.hero .val{color:var(--cherry)}
  .sec{padding:20px;margin-bottom:16px}
  .sec h3{font-family:'Fraunces',serif;font-weight:500;font-size:18px;margin:0 0 4px}
  .sec .sub{font-size:13px;color:var(--muted);margin:0 0 14px}
  .msgbox{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:14px;color:var(--accent-ink);position:relative}
  .nudge{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--glass-brd);background:var(--glass-2);border-radius:12px;margin-bottom:8px;flex-wrap:wrap}
  .nudge .who{flex:1;min-width:140px}.nudge .who b{font-size:14px}.nudge .who .ph{font-size:12.5px;color:var(--muted)}
  .nudge a.wa{text-decoration:none}
  .mini{border:1px solid var(--glass-brd);background:var(--glass);border-radius:99px;padding:7px 14px;font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
  .mini.wa{background:#25D366;color:#fff;border-color:#25D366}
  .mini:disabled{opacity:.5;cursor:progress}
  .err{color:var(--risk);font-weight:600}
  .empty{color:var(--muted);text-align:center;padding:18px;font-size:14px}
  footer{margin-top:24px;color:var(--muted);font-size:12px;text-align:center}

  /* experiment comparison */
  .exp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  .exp .card{border:1px solid var(--glass-brd);background:var(--glass-2);border-radius:14px;padding:14px}
  .exp .card.live{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .exp .card h4{margin:0;font-family:'Fraunces',serif;font-weight:500;font-size:15.5px}
  .exp .card .tag{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-ink);font-weight:700}
  .exp .card .big{font-family:'Fraunces',serif;font-weight:600;font-size:28px;line-height:1.15;margin-top:6px}
  .exp .card .n{font-size:12.5px;color:var(--muted)}

  /* people */
  .person{border:1px solid var(--glass-brd);background:var(--glass-2);border-radius:14px;padding:13px 15px;margin-bottom:10px}
  .person .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .person .em{font-weight:700;font-size:14.5px;word-break:break-all}
  .person .meta{font-size:12.5px;color:var(--muted)}
  .person .ctl{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;margin-top:10px}
  /* Keep each label with the control it names. Left to wrap freely, "Act 1" ended up on one line
     and its dropdown on the next, reading as a stray label. */
  .person .grp{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .person label{font-size:12px;color:var(--muted);font-weight:600}
  select,input[type="number"]{font:inherit;font-size:13px;padding:6px 9px;border-radius:10px;border:1px solid var(--glass-brd);background:var(--glass);color:var(--ink)}
  input[type="number"]{width:84px}
  .pill{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px}
  .pill.active{background:rgba(54,125,105,.16);color:var(--good)}
  .pill.limited{background:rgba(152,102,27,.18);color:var(--warn)}
  .pill.suspended{background:rgba(176,82,59,.16);color:var(--risk)}
  .pill.out{background:rgba(88,72,191,.12);color:var(--accent-ink)}
  .setup{padding:20px;margin-bottom:16px;border:1px solid var(--risk);background:rgba(255,255,255,.62)}
  .setup h3{color:var(--risk)}
  .setup code{background:rgba(49,46,82,.07);padding:2px 6px;border-radius:6px;font-size:12.5px}
  .setup ol{margin:10px 0 0;padding-left:20px;font-size:13.5px}
  .setup li{margin-bottom:4px}
  .setup .miss{font-size:13px;color:var(--muted);margin-top:10px}
  .okline{font-size:13px;color:var(--good);font-weight:700;margin:0 0 14px}
  .saved{font-size:12px;font-weight:700;color:var(--good);opacity:0;transition:opacity .2s}
  .saved.on{opacity:1}
  .switch{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--hair)}
  .switch:last-child{border-bottom:none}
  .switch .t{flex:1}.switch .t b{font-size:14px;display:block}
  .switch .t span{font-size:12.5px;color:var(--muted)}
  .switch input[type="checkbox"]{accent-color:var(--cherry)}   /* default blue fights the palette */
  .hide{display:none!important}
  .hdr-actions{display:flex;align-items:center;gap:12px}
  .adv{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;min-height:44px}
  .adv input{accent-color:var(--cherry);width:18px;height:18px}
  .summary{font-size:16px;line-height:1.65;color:var(--ink);margin:0 0 16px}
  .summary b{font-family:'Fraunces',serif;font-weight:600;font-size:19px;color:var(--accent-ink)}
  .adv-head{font-family:'Fraunces',serif;font-size:20px;font-weight:600;margin:28px 0 12px;padding-top:18px;border-top:1px solid var(--hair)}
  .person .simple{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
  .act{border:none;border-radius:999px;padding:10px 18px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;min-height:44px}
  .act.give{background:var(--accent-soft);color:var(--accent-ink)}
  .act.pause{background:#F6E3DD;color:var(--risk)}
  .act.resume{background:#CFE7E1;color:var(--good)}
  .act:disabled{opacity:.55;cursor:progress}
  .btn,.tabs button{border-radius:999px}
  @media (max-width:760px){ *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important} .glass{background:rgba(255,255,255,.92)!important} }
  .review-row{padding:12px 0;border-top:1px solid #D6D3E3}
  .review-row:first-of-type{border-top:none}
  .stars{color:#7164C6;letter-spacing:2px;font-size:16px}
  .stars .off{color:#D6D3E3}
  .rv-text{margin:4px 0;color:#312E52;line-height:1.45}
  .rv-text.muted{color:#686586;font-style:italic}
  .rv-meta{font-size:12px;color:#686586}
  .act.del{color:#B0523B;border-color:rgba(176,82,59,.35);margin-left:auto}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="word serif">Samvaad<span class="d">.</span><span class="sub">Admin</span></div>
    <div class="hdr-actions"><label class="adv"><input type="checkbox" id="advToggle"> Advanced</label><button class="btn soft" id="refreshBtn">Refresh</button></div>
  </header>

  <div class="tabs hide" id="tabs">
    <button data-t="metrics" aria-selected="true">Overview</button>
    <button data-t="people" aria-selected="false">People</button>
  </div>

  <div id="content"><div class="glass gate"><p class="note">Loading…</p></div></div>

  <footer>Internal · read live from your backend.</footer>
</div>

<script>
  var BACKEND_URL = (localStorage.getItem('samvaad.beUrl') || "https://samvaad-backend-gyk9.onrender.com").replace(/\/+$/, "");  // Render backend (override via Settings)
  var $ = function(id){ return document.getElementById(id); };
  var content = $('content');
  var TAB = 'metrics';
  // The manager is not technical, so the console opens simple. Technical panels sit behind Advanced,
  // and the choice is remembered on this device.
  var ADV = false; try{ ADV = localStorage.getItem('samvaad.adminAdvanced') === '1'; }catch(e){}
  var DATA = { kpis:null, nudges:null, users:null, settings:null, schema:null };

  function esc(s){ s=(s==null?'':String(s)); return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function gate(html){ $('tabs').classList.add('hide'); content.innerHTML = '<div class="glass gate">'+html+'</div>'; }
  function waNumber(p){ var d=String(p||'').replace(/\D/g,''); if(d.length===10) d='91'+d; return d; }
  function headers(){ return Object.assign({'content-type':'application/json'}, SamvaadAuth.authHeaders()); }
  function ago(iso){
    if(!iso) return 'never';
    var d=(Date.now()-new Date(iso).getTime())/86400000;
    if(d<1) return 'today';
    if(d<2) return 'yesterday';
    if(d<30) return Math.floor(d)+'d ago';
    return new Date(iso).toLocaleDateString([], {month:'short', day:'numeric'});
  }

  async function load(){
    try{
      if(!SamvaadAuth.readSession()){
        return gate('<h2 class="serif">Admin sign-in needed</h2><p class="note">Please <a href="login.html">sign in</a> with an admin account.</p>');
      }
      if(!BACKEND_URL){
        return gate('<h2 class="serif">Set your Backend URL</h2><p class="note">Open the app → <b>Settings</b> → paste your Render backend URL.</p>');
      }
      var h = headers();
      var res = await Promise.all([
        fetch(BACKEND_URL + '/api/admin/kpis',     { headers: h }),
        fetch(BACKEND_URL + '/api/admin/nudges',   { headers: h }),
        fetch(BACKEND_URL + '/api/admin/users',    { headers: h }),
        fetch(BACKEND_URL + '/api/admin/settings', { headers: h }),
        fetch(BACKEND_URL + '/api/admin/schema',   { headers: h })
      ]);
      if(res.some(function(r){ return r.status === 403; })){
        return gate('<h2 class="serif">Not an admin</h2><p class="note">This account isn’t in the backend allowlist (<code>ADMIN_USER_IDS</code>). Ask the owner to add your Supabase user id.</p>');
      }
      var out = await Promise.all(res.map(function(r){ return r.json(); }));
      DATA.kpis = out[0]; DATA.nudges = out[1]; DATA.users = out[2]; DATA.settings = out[3]; DATA.schema = out[4];
      $('tabs').classList.remove('hide');
      render();
    }catch(e){
      gate('<h2 class="serif">Couldn’t load</h2><p class="note err">'+esc(e.message||String(e))+'</p><p class="note">Check the Backend URL and that the server is awake (Render free tier sleeps).</p>');
    }
  }

  function render(){ TAB === 'people' ? renderPeople() : renderMetrics(); }

  /* The database is the one dependency the console cannot paper over. Lead with it: a missing
     migration used to show up only as a browser alert full of PostgREST jargon, on a page that
     had already rendered convincing-looking defaults. */
  function schemaBanner(){
    var sc = DATA.schema;
    if(!sc) return '';
    if(sc.configured === false){
      return '<div class="glass sec setup"><h3>Backend has no database keys</h3>'
        + '<p class="note">Set <code>SUPABASE_URL</code> and <code>SUPABASE_SERVICE_KEY</code> on Render. Nothing is being saved right now.</p></div>';
    }
    if(sc.ok) return '';
    var bits = [];
    (sc.missingTables || []).forEach(function(t){ bits.push('<li>table <code>'+esc(t)+'</code> is missing</li>'); });
    (sc.missingColumns || []).forEach(function(m){ bits.push('<li><code>'+esc(m.table)+'</code> is missing: '+esc((m.columns||[]).join(', '))+'</li>'); });
    return '<div class="glass sec setup"><h3>Your database is behind the app</h3>'
      + '<p class="note">Until this is fixed, limits are not enforced, per-user settings cannot be saved, and the replay loses its speaker map.</p>'
      + '<ol>'
      + '<li>Open Supabase → <b>SQL Editor</b> → New query.</li>'
      + '<li>Paste all of <code>backend/migrations/000-bring-schema-current.sql</code> and press Run.</li>'
      + '<li>Come back and hit <b>Refresh</b>. This banner disappears.</li>'
      + '</ol>'
      + '<div class="miss"><b>What is missing right now:</b><ul>' + bits.join('') + '</ul></div>'
      + '</div>';
  }

  /* ---------------- Metrics ---------------- */
  function kpi(lab, val, hint, hero){
    return '<div class="glass kpi'+(hero?' hero':'')+'"><div class="lab">'+esc(lab)+'</div><div class="val">'+esc(val)+'</div>'
      + (hint ? '<div class="hint">'+esc(hint)+'</div>' : '') + '</div>';
  }

  function renderMetrics(){
    var k = DATA.kpis || {}, f = k.funnel||{}, a = k.activity||{}, q = k.quality||{}, acc = k.accounts||{}, cap = k.capacity||{};
    var html = '';

    // The simple view: the few numbers a manager actually asks about, in plain words.
    var joined = f.signups||0, tried = f.activated||0, back = f.returning||0, out = f.exhausted||0, week = a.last7||0;
    html += '<p class="summary">'
      + '<b>'+joined+'</b> '+(joined===1?'person has':'people have')+' joined. '
      + '<b>'+tried+'</b> tried it at least once'+(joined?' ('+(f.activationRate||0)+'%)':'')+', and <b>'+back+'</b> came back for more. '
      + '<b>'+week+'</b> conversation'+(week===1?' was':'s were')+' read this week.'
      + '</p>';
    html += '<div class="grid">'
      + kpi('People who joined', joined, 'signed up for the trial')
      + kpi('Tried it', tried, 'ran at least one conversation', true)
      + kpi('Came back', back, 'used it more than once', true)
      + kpi('Out of free conversations', out, out ? 'give them more on the People tab' : 'nobody has hit the limit')
      + '</div>';
    // what people said when their free conversations ran out
    var rv = k.reviews || {};
    html += '<div class="glass sec"><h3>What people said</h3>'
      + (rv.count
          ? '<p class="sub"><b>'+esc(rv.average)+' out of 5</b> from '+rv.count+' review'+(rv.count===1?'':'s')+', given at the end of a free trial.</p>'
            + (rv.latest||[]).map(function(x){
                var n = Math.max(1, Math.min(5, Number(x.stars)||0));
                return '<div class="review-row"><div class="stars" aria-label="'+n+' out of 5">'+'★★★★★'.slice(0,n)+'<span class="off">'+'★★★★★'.slice(0,5-n)+'</span></div>'
                  + (x.review ? '<p class="rv-text">'+esc(x.review)+'</p>' : '<p class="rv-text muted">No written review</p>')
                  + '<div class="rv-meta">'+esc(x.email || 'guest')+' · '+esc(ago(x.at))+(x.canQuote?' · <b>OK to quote</b>':'')+'</div></div>';
              }).join('')
          : '<p class="sub">No reviews yet. People are asked for one when they finish their free conversations.</p>')
      + '</div>';
    html += simpleSwitches();
    html += nudgeSection();

    if (ADV) {
      html += '<div class="adv-head">Advanced</div>';
      html += '<div class="grid">'
        + kpi('Gave a number', f.withPhone||0, 'reachable on WhatsApp')
        + kpi('Analyses', a.analyses||0, (a.today||0)+' today · '+(a.last7||0)+' this week')
        + kpi('Active this week', a.activeLast7||0, 'distinct people')
        + kpi('Per active user', a.perActivatedUser||0, 'analyses each')
        + kpi('Avg score', q.avgScore==null?'…':q.avgScore, 'across all reports')
        + kpi('Avg escalation', q.avgEscalation==null?'…':q.avgEscalation, 'higher = more heat')
        + kpi('Check-in opt-ins', f.optins||0, 'consented to WhatsApp')
        + '</div>';

      html += '<div class="glass sec"><h3>Act 1: which opening works</h3>'
        + '<p class="sub">The walk-through opens by replaying the real conversation. Three ways to deliver it, one question: does it make someone say they will actually try the suggested line?</p>'
        + expCards(k.experiment||{}, (DATA.settings&&DATA.settings.settings&&DATA.settings.settings.act1_mode)||'voiced')
        + '</div>';

      var intro = k.intro || {};
      html += '<div class="glass sec"><h3>The intro</h3>'
        + '<div class="grid" style="margin:0">'
        + kpi('Started', intro.started||0, 'people who saw it')
        + kpi('Watched to the end', intro.completed||0, intro.completionRate==null?'…':intro.completionRate+'% of starts')
        + kpi('Skipped', intro.skipped||0, intro.avgSceneOnSkip==null?'…':'average scene '+intro.avgSceneOnSkip)
        + kpi('Voice blocked', intro.audioBlocked||0, 'browser refused autoplay')
        + '</div></div>';

      html += '<div class="glass sec"><h3>Accounts</h3><div class="grid" style="margin:10px 0 0">'
        + kpi('Active', acc.active||0, '') + kpi('Limited', acc.limited||0, '') + kpi('Paused', acc.suspended||0, '')
        + '</div></div>';

      html += settingsPanel();

      html += '<div class="glass sec"><h3>Capacity</h3>'
        + '<p class="sub">Analysis engine: <b>'+esc(cap.model||'…')+'</b> at '+esc(cap.tpm||'…')+' tokens/min, which sets the longest conversation the product accepts: <b>'+esc((cap.limits&&cap.limits.maxMinutes)||'…')+' minutes</b>. Raise GROQ_TPM on Render after upgrading the Groq plan.</p>'
        + '<p class="note">Analysis minutes this month: <b>'+esc(cap.minutesThisMonth||0)+'</b> · long conversations trimmed: <b>'+esc(a.truncated||0)+'</b></p>'
        + voiceCard(k.voice||{})
        + '</div>';
    }

    content.innerHTML = schemaBanner() + (ADV ? voiceBanner(k.voice||{}) : '')
      + (ADV && DATA.schema && DATA.schema.ok ? '<p class="okline">Database is up to date.</p>' : '')
      + html;
    wireSettings();
  }

  // Only the two switches a manager decides. Advanced renders the full panel with the same ids, so
  // the two are never drawn at the same time.
  function simpleSwitches(){
    if (ADV) return '';
    var s = (DATA.settings && DATA.settings.settings) || {};
    var sw = function(id, title, sub, on){
      return '<div class="switch"><div class="t"><b>'+esc(title)+'</b><span>'+esc(sub)+'</span></div>'
        + '<input type="checkbox" id="'+id+'"'+(on?' checked':'')+' style="width:20px;height:20px;cursor:pointer">'
        + '<span class="saved" id="'+id+'Saved">Saved</span></div>';
    };
    return '<div class="glass sec"><h3>Switches</h3>'
      + sw('setGuest','Let people try without an account','Guests can use the app, but nothing they do is saved.', s.guest_enabled!==false)
      + sw('setIntro','Show the intro video','New visitors see a short film before signing in.', s.intro_enabled!==false)
      + '</div>';
  }

  function expCards(exp, live){
    var labels = { voiced:'Voiced', real_audio:'Their real audio', silent:'Silent, bubbles only' };
    var desc = { voiced:'Avatars speak their lines', real_audio:'Their own recording plays', silent:'No voice at all' };
    var keys = ['voiced','real_audio','silent'];
    return '<div class="exp">' + keys.map(function(k){
      var e = exp[k] || { sessions:0, feedback:0, yes:0, willTryRate:null };
      return '<div class="card'+(k===live?' live':'')+'">'
        + (k===live ? '<div class="tag">Default</div>' : '<div class="tag" style="opacity:.35">&nbsp;</div>')
        + '<h4>'+esc(labels[k])+'</h4>'
        + '<div class="n">'+esc(desc[k])+'</div>'
        + '<div class="big">'+(e.willTryRate==null ? '…' : e.willTryRate+'%')+'</div>'
        + '<div class="n">said they’ll try it · '+esc(e.feedback||0)+' answered of '+esc(e.sessions||0)+' sessions</div>'
        + '</div>';
    }).join('') + '</div>';
  }

  function settingsPanel(){
    var s = (DATA.settings && DATA.settings.settings) || {};
    var sw = function(id, title, sub, on){
      return '<div class="switch"><div class="t"><b>'+esc(title)+'</b><span>'+esc(sub)+'</span></div>'
        + '<input type="checkbox" id="'+id+'"'+(on?' checked':'')+' style="width:18px;height:18px;cursor:pointer">'
        + '<span class="saved" id="'+id+'Saved">Saved</span></div>';
    };
    return '<div class="glass sec"><h3>Settings</h3>'
      + '<p class="sub">Global switches. These take effect immediately, without a deploy or an env var.</p>'
      + '<div class="switch"><div class="t"><b>Act 1 default</b><span>Which opening a new account gets, unless pinned on the People tab.</span></div>'
      + '<select id="setAct1">'
      + ['voiced','real_audio','silent'].map(function(m){
          return '<option value="'+m+'"'+(s.act1_mode===m?' selected':'')+'>'+({voiced:'Voiced',real_audio:'Their real audio',silent:'Silent'})[m]+'</option>';
        }).join('')
      + '</select><span class="saved" id="setAct1Saved">Saved</span></div>'
      + '<div class="switch"><div class="t"><b>Conversations per new account</b><span>The trial allowance every new sign-up starts with. Changing it does not affect people who already signed up.</span></div>'
      + '<input type="number" id="setAllow" min="0" step="1" value="'+esc(s.default_analyses_quota==null?3:s.default_analyses_quota)+'" style="width:74px">'
      + '<button class="mini" id="setAllowBtn">Save</button><span class="saved" id="setAllowSaved">Saved</span></div>'
      + sw('setGuest','Guest access','Lets someone try the app without an account. Turn off before inviting real testers.', s.guest_enabled!==false)
      + sw('setIntro','Intro animation','Show the how-it-works animation to first-time visitors before the login page.', s.intro_enabled!==false)
      + sw('setSelf','“Just me” mode','Self reflection is built but closed for the trial. Opens it for everyone.', s.self_reflection_enabled===true)
      + '</div>';
  }

  function wireSettings(){
    var bind = function(id, key, get){
      var el = $(id); if(!el) return;
      el.onchange = async function(){
        var body = {}; body[key] = get(el);
        var ok = await patchSettings(body);
        var sv = $(id+'Saved'); if(sv && ok){ sv.classList.add('on'); setTimeout(function(){ sv.classList.remove('on'); }, 1400); }
      };
    };
    var ab = $('setAllowBtn');
    if(ab) ab.onclick = async function(){
      var ok = await patchSettings({ default_analyses_quota: Number($('setAllow').value) });
      var sv = $('setAllowSaved'); if(sv && ok){ sv.classList.add('on'); setTimeout(function(){ sv.classList.remove('on'); }, 1400); }
    };
    bind('setAct1','act1_mode',  function(e){ return e.value; });
    bind('setGuest','guest_enabled', function(e){ return e.checked; });
    bind('setIntro','intro_enabled', function(e){ return e.checked; });
    bind('setSelf','self_reflection_enabled', function(e){ return e.checked; });
  }

  async function patchSettings(body){
    try{
      var r = await fetch(BACKEND_URL + '/api/admin/settings', { method:'PATCH', headers: headers(), body: JSON.stringify(body) });
      if(!r.ok){ var d = await r.json().catch(function(){ return {}; }); alert(d.error || 'Could not save that setting.'); return false; }
      Object.assign(DATA.settings.settings, body);
      return true;
    }catch(e){ alert(String(e.message||e)); return false; }
  }

  function voiceCard(v){
    if(!v || !v.ok) return '<p class="note" style="margin-top:8px">Voice quota unavailable'+(v&&v.error?' ('+esc(v.error)+')':'')+'.</p>';
    var pct = v.limit ? Math.round((v.used / v.limit) * 100) : 0;
    return '<p class="note" style="margin-top:8px">Voice characters: <b>'+Number(v.remaining).toLocaleString()+'</b> left of '
      + Number(v.limit).toLocaleString() + ' ('+pct+'% used'+(v.tier?' · '+esc(v.tier):'')+').</p>';
  }
  function voiceBanner(v){
    if(!v || !v.exhausted) return '';
    return '<div class="glass sec" style="border-color:var(--risk)"><h3 style="color:var(--risk)">Voice quota exhausted</h3>'
      + '<p class="note">ElevenLabs characters are used up for this cycle. Replays fall back to the browser voice until it resets.</p></div>';
  }

  function nudgeSection(){
    var n = DATA.nudges || {};
    var list = (n.nudges || []);
    var msg = n.suggestedMessage || '';
    var body = list.length ? list.map(function(p, i){
      var num = waNumber(p.phone);
      return '<div class="nudge"><div class="who"><b>'+esc(p.display_name || 'Friend')+'</b><div class="ph">+'+esc(num)+'</div></div>'
        + '<a class="mini wa" target="_blank" rel="noopener" href="https://wa.me/'+encodeURIComponent(num)+'?text='+encodeURIComponent(msg)+'">Message on WhatsApp</a></div>';
    }).join('') : '<div class="empty">No one has opted in to daily check-ins yet.</div>';
    return '<div class="glass sec"><h3>Today’s check-ins · '+list.length+'</h3>'
      + '<p class="sub">Consented opt-ins only, their own numbers. Sent by hand while the trial is small.</p>'
      + (msg ? '<div class="msgbox">'+esc(msg)+'</div>' : '')
      + body + '</div>';
  }

  /* ---------------- People ---------------- */
  function renderPeople(){
    var users = (DATA.users && DATA.users.users) || [];
    if(!users.length){ content.innerHTML = schemaBanner() + '<div class="glass sec"><div class="empty">No accounts yet.</div></div>'; return; }
    content.innerHTML = schemaBanner() + '<div class="glass sec"><h3>People · '+users.length+'</h3>'
      + '<p class="sub">'+(ADV
          ? 'Change status, limits, or pin someone to one act-1 variant. Changes apply on their next request.'
          : 'Give someone more free conversations, or pause their account. Changes apply straight away.')+'</p>'
      + users.map(personRow).join('')
      + '</div>';
    users.forEach(wirePerson);
  }

  function personRow(u){
    var id = u.id, paused = u.status === 'suspended';
    var left = Math.max(0, (Number(u.analysesQuota)||0) - (Number(u.analysesUsed)||0));
    var word = paused ? 'Paused' : (u.status === 'limited' ? 'Limited' : 'Active');
    var h = '<div class="person" id="p_'+id+'">'
      + '<div class="hd"><span class="em">'+esc(u.email || '(no email)')+'</span>'
        + '<span class="pill '+(paused ? 'suspended' : esc(u.status))+'">'+word+'</span>'
        + (left === 0 ? '<span class="pill out">out of free conversations</span>' : '')
      + '</div>'
      + '<div class="meta">'+esc(u.analysesUsed)+' of '+esc(u.analysesQuota)+' conversations used · last active '+esc(ago(u.lastActive))
        + (u.phone ? ' · +'+esc(waNumber(u.phone)) : '') + '</div>'
      + '<div class="simple">'
        + '<button class="act give" id="g3_'+id+'">Give 3 more</button>'
        + (paused ? '<button class="act resume" id="ps_'+id+'">Resume</button>' : '<button class="act pause" id="ps_'+id+'">Pause</button>')
        + (u.phone ? '<a class="mini wa" target="_blank" rel="noopener" href="https://wa.me/'+encodeURIComponent(waNumber(u.phone))+'">WhatsApp</a>' : '')
        + '<button class="act del" id="dl_'+id+'">Delete</button>'
        + '<span class="saved" id="sv_'+id+'">Saved</span>'
      + '</div>';
    if (ADV) {
      h += '<div class="ctl">'
        + '<span class="grp"><label for="st_'+id+'">Status</label>'
        + '<select id="st_'+id+'">'
          + ['active','limited','suspended'].map(function(s){ return '<option value="'+s+'"'+(u.status===s?' selected':'')+'>'+s+'</option>'; }).join('')
        + '</select></span>'
        + '<span class="grp"><label for="ac_'+id+'">Conversations</label>'
        + '<input type="number" id="ac_'+id+'" min="0" step="1" value="'+esc(u.analysesQuota)+'">'
        + '<button class="mini" id="acb_'+id+'">Save</button>'
        + '<button class="mini" id="arb_'+id+'">Reset count</button></span>'
        + '<span class="grp"><label for="q_'+id+'">Minutes</label>'
        + '<input type="number" id="q_'+id+'" min="0" step="10" value="'+esc(u.minutesQuota)+'">'
        + '<button class="mini" id="qb_'+id+'">Save</button>'
        + '<button class="mini" id="rb_'+id+'">Reset month</button></span>'
        + '<span class="grp"><label for="a1_'+id+'">Act 1</label>'
        + '<select id="a1_'+id+'">'
          + '<option value=""'+(!u.act1Override?' selected':'')+'>default ('+esc(u.act1)+')</option>'
          + ['voiced','real_audio','silent'].map(function(m){ return '<option value="'+m+'"'+(u.act1Override===m?' selected':'')+'>'+m+'</option>'; }).join('')
        + '</select></span>'
        + '</div>';
    }
    return h + '</div>';
  }

  function wirePerson(u){
    var id = u.id;
    var flash = function(){ var s = $('sv_'+id); if(!s) return; s.classList.add('on'); setTimeout(function(){ s.classList.remove('on'); }, 1500); };
    var send = async function(body, btn){
      if(btn){ btn.disabled = true; }
      try{
        var r = await fetch(BACKEND_URL + '/api/admin/users/' + encodeURIComponent(id), { method:'PATCH', headers: headers(), body: JSON.stringify(body) });
        var d = await r.json().catch(function(){ return {}; });
        if(!r.ok){ alert(d.error || 'Could not apply that change.'); return; }
        // keep the local copy honest so a tab switch does not show stale values
        if(d.profile){
          u.status = d.profile.status; u.minutesQuota = Number(d.profile.minutes_quota);
          u.analysesQuota = Number(d.profile.analyses_quota); u.analysesUsed = Number(d.profile.analyses_used || 0);
          u.minutesUsed = d.profile.quota_month === new Date().toISOString().slice(0,7) ? Number(d.profile.minutes_used_month||0) : 0;
          u.features = d.profile.features || {}; u.act1Override = u.features.act1 || null;
        }
        flash();
      }catch(e){ alert(String(e.message||e)); }
      finally{ if(btn){ btn.disabled = false; } }
    };

    var after = function(){ renderPeople(); var sv = $('sv_'+id); if(sv){ sv.classList.add('on'); setTimeout(function(){ sv.classList.remove('on'); }, 1500); } };
    var g3 = $('g3_'+id); if(g3) g3.onclick = function(){ send({ analysesQuota: (Number(u.analysesQuota)||0) + 3 }, g3).then(after); };
    var ps = $('ps_'+id); if(ps) ps.onclick = function(){
      var pausing = u.status !== 'suspended';
      // a stray tap should not lock someone out
      if (pausing && !confirm('Pause ' + (u.email || 'this account') + '? They will not be able to run new conversations until you resume.')) return;
      send({ status: pausing ? 'suspended' : 'active' }, ps).then(after);
    };
    // Deleting removes the account and everything attached to it, for good, so it always asks first.
    var dl = $('dl_'+id); if(dl) dl.onclick = async function(){
      var who = u.email || 'this account';
      if (!confirm('Delete ' + who + ' permanently?\n\nThis removes their account, every reflection, their consents and their check-in settings. It cannot be undone.')) return;
      dl.disabled = true;
      try{
        var r = await fetch(BACKEND_URL + '/api/admin/users/' + encodeURIComponent(id), { method:'DELETE', headers: headers() });
        var d = await r.json().catch(function(){ return {}; });
        if(!r.ok){ alert(d.error || 'Could not delete that account.'); dl.disabled = false; return; }
        DATA.users.users = DATA.users.users.filter(function(x){ return x.id !== id; });
        renderPeople();
      }catch(e){ alert(String(e.message||e)); dl.disabled = false; }
    };
    var st = $('st_'+id); if(st) st.onchange = function(){ send({ status: st.value }); };
    var acb = $('acb_'+id); if(acb) acb.onclick = function(){ send({ analysesQuota: Number($('ac_'+id).value) }, acb); };
    var arb = $('arb_'+id); if(arb) arb.onclick = function(){ send({ resetAnalyses: true }, arb); };
    var qb = $('qb_'+id); if(qb) qb.onclick = function(){ send({ minutesQuota: Number($('q_'+id).value) }, qb); };
    var rb = $('rb_'+id); if(rb) rb.onclick = function(){ send({ resetUsage: true }, rb); };
    var a1 = $('a1_'+id); if(a1) a1.onchange = function(){ send({ act1: a1.value || null }); };
  }

  /* ---------------- boot ---------------- */
  document.querySelectorAll('#tabs button').forEach(function(b){
    b.onclick = function(){
      document.querySelectorAll('#tabs button').forEach(function(x){ x.setAttribute('aria-selected','false'); });
      b.setAttribute('aria-selected','true');
      TAB = b.dataset.t; render(); window.scrollTo({ top:0, behavior:'smooth' });
    };
  });
  $('refreshBtn').onclick = load;
  $('advToggle').checked = ADV;
  $('advToggle').onchange = function(){ ADV = this.checked; try{ localStorage.setItem('samvaad.adminAdvanced', ADV ? '1' : '0'); }catch(e){} render(); };
  load();
</script>
</body>
</html>
