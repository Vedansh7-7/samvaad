<!doctype html>
<!--
  Samvaad — the first thing a new visitor sees.

  The two official Rive rigs introduce the product themselves: whoever is speaking is lip-synced
  to real ElevenLabs narration (audio/intro/*.mp3), the other one listens. Same rigs, same
  expression and phoneme wiring as the replay inside the app, so the intro is not a separate
  illusion — it is the product, talking.

  Why a live page and not an MP4: it is 271KB of audio instead of a multi-megabyte video, the
  vector rigs stay sharp at any size, the copy can be edited without re-rendering, and we can
  measure exactly where someone stopped watching. An MP4 export of this same page lives in
  docs/ for marketing.

  Autoplay: browsers refuse audio without a gesture, so this opens on a poster frame with one
  play button. That is not a workaround — it is the only honest way to guarantee the voice
  actually plays instead of half the audience meeting a silent film.

  Shown once per browser (localStorage 'samvaad.introSeen'), skippable at every moment, and the
  admin can switch it off for everyone (app_settings.intro_enabled).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samvaad · How it works</title>
<script src="https://unpkg.com/@rive-app/canvas@2/rive.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Mulish:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap');
  :root{
    --ink:#2E2024; --muted:#6E5258;
    --glass:rgba(255,255,255,.52); --glass-2:rgba(255,255,255,.7); --glass-brd:rgba(255,255,255,.74);
    --cherry:#C8324B; --cherry-2:#A52741; --accent-soft:#F8DDE0; --accent-ink:#9E2740;
    --good:#4F8A6B;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;color:var(--ink);font-family:'Mulish',system-ui,sans-serif;line-height:1.6;overflow:hidden;
    background:radial-gradient(120% 90% at 12% 6%,#FDEEF0 0%,rgba(253,238,240,0) 46%),
               radial-gradient(120% 100% at 92% 18%,#F8D6DD 0%,rgba(248,214,221,0) 50%),
               linear-gradient(160deg,#FDF3F2 0%,#F9DEE3 48%,#F1DDE8 100%);}
  .serif{font-family:'Fraunces',serif}
  .dv{font-family:'Mulish','Noto Sans Devanagari',sans-serif}
  .arc{position:fixed;border-radius:50%;border:1px solid rgba(200,50,75,.13);pointer-events:none}
  .a1{width:520px;height:520px;top:-190px;right:-160px}
  .a2{width:360px;height:360px;bottom:-150px;left:-120px}

  .wrap{position:relative;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:14px 18px 20px;max-width:600px;margin:0 auto}

  /* progress + controls */
  .top{display:flex;align-items:center;gap:10px}
  .bars{flex:1;display:flex;gap:5px}
  .bars i{flex:1;height:3px;border-radius:99px;background:rgba(70,40,50,.14);overflow:hidden;position:relative}
  .bars i b{position:absolute;inset:0;background:var(--cherry);transform:scaleX(0);transform-origin:left;border-radius:99px;transition:transform .12s linear}
  .ic{border:1px solid var(--glass-brd);background:var(--glass);border-radius:99px;width:32px;height:32px;display:grid;place-items:center;font-size:14px;cursor:pointer;padding:0;line-height:1}
  .skip{border:none;background:none;font:inherit;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;padding:4px 2px}
  .skip:hover{color:var(--accent-ink)}

  /* stage: the two rigs */
  .mid{display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:0;padding:6px 0}
  .stage{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--glass-brd);
    background:linear-gradient(170deg,#FCF3EA,#F6E2D6);box-shadow:0 26px 60px -34px rgba(70,30,45,.55)}
  .scene{position:relative;height:clamp(240px,44dvh,400px);overflow:hidden}
  .scene-bg{position:absolute;inset:0}
  .ch{position:absolute;bottom:-4px;width:clamp(160px,44%,230px);text-align:center;z-index:1;transition:filter .5s,opacity .5s,transform .5s}
  .ch.a{left:4%}.ch.b{right:4%}
  .ch.idle{filter:saturate(.72) brightness(.99);opacity:.82;transform:translateY(4px) scale(.97)}
  .rvc{display:block;width:100%;height:clamp(200px,36dvh,330px);transform:scale(1.02);transform-origin:bottom center}
  .rvc.flip{transform:scaleX(-1) scale(1.02)}
  @media (max-height:700px){ .scene{height:min(220px,30dvh)} .rvc{height:184px} .ch{width:150px} .say{margin-top:10px} }

  /* the line being spoken */
  .cap{padding:13px 16px 15px;background:var(--glass-2);border-top:1px solid var(--glass-brd);min-height:78px;display:flex;align-items:center;gap:10px}
  .cap .who{flex:0 0 auto;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent-ink);
    background:var(--accent-soft);border-radius:99px;padding:3px 10px}
  .cap .txt{font-size:14.5px;line-height:1.5}

  /* headline under the stage */
  .say{text-align:center;margin-top:16px}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);font-weight:700}
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(21px,5.2vw,28px);line-height:1.24;margin:6px 0 0;letter-spacing:-.01em}
  .anim{animation:rise .55s cubic-bezier(.22,1,.36,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  .bottom{display:flex;flex-direction:column;align-items:center;gap:10px}
  .btn{border:none;border-radius:14px;padding:14px 30px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;color:#fff;
    background:linear-gradient(180deg,var(--cherry),var(--cherry-2));box-shadow:0 16px 30px -14px rgba(165,39,65,.6);transition:transform .2s}
  .btn:hover{transform:translateY(-2px)}
  .tapnote{font-size:12.5px;color:var(--muted);min-height:19px}

  /* poster frame: the gesture that buys us audio */
  .poster{position:fixed;inset:0;z-index:20;display:grid;place-items:center;text-align:center;padding:24px;
    background:radial-gradient(120% 90% at 12% 6%,#FDEEF0 0%,rgba(253,238,240,0) 46%),
               radial-gradient(120% 100% at 92% 18%,#F8D6DD 0%,rgba(248,214,221,0) 50%),
               linear-gradient(160deg,#FDF3F2 0%,#F9DEE3 48%,#F1DDE8 100%)}
  .poster .lotus{margin-bottom:16px}
  .poster h2{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(24px,6.4vw,34px);margin:0 0 8px;line-height:1.2}
  .poster p{color:var(--muted);margin:0 0 22px;font-size:15px;max-width:34ch}
  .poster .row{display:flex;gap:12px;align-items:center;flex-direction:column}
  .poster .len{font-size:12.5px;color:var(--muted);margin-top:2px}

  @media (prefers-reduced-motion: reduce){ .anim{animation:none!important} }

  /* Film mode (intro.html?film=1): the same page with the interactive chrome removed, used to
     record docs/media/samvaad-intro.mp4. Exporting FROM the product rather than building a
     separate video means the marketing clip can never drift from what people actually see. */
  body.film .top,body.film .bottom{display:none!important}
  body.film .wrap{grid-template-rows:1fr;padding:26px 22px;max-width:660px}
  body.film .scene{height:clamp(340px,50dvh,560px)}
  body.film .rvc{height:clamp(300px,44dvh,480px)}
  body.film .ch{width:clamp(210px,46%,300px)}
  body.film .cap{min-height:96px;padding:16px 20px 18px}
  body.film .cap .txt{font-size:17px}
  body.film h1{font-size:clamp(26px,4.4vw,38px)}
  body.film .eyebrow{font-size:12.5px}
  body.film .say{margin-top:22px}
</style>
</head>
<body>
<div class="arc a1"></div><div class="arc a2"></div>

<!-- Poster. One tap here is what lets the voice-over actually play. -->
<div class="poster" id="poster">
  <div>
    <svg class="lotus" width="86" height="66" viewBox="0 0 120 90" fill="none" stroke="var(--cherry)" stroke-width="1.6" stroke-linecap="round">
      <path d="M60 79 C44 56 38 40 32 30 C46 36 54 54 60 79"/><path d="M60 79 C76 56 82 40 88 30 C74 36 66 54 60 79"/>
      <path d="M60 79 C52 50 52 28 60 14 C68 28 68 50 60 79 Z"/><path d="M16 80 Q60 89 104 80"/>
    </svg>
    <h2 class="serif">Understand the conversation<br>that keeps replaying</h2>
    <p>Forty-five seconds, from two people who use it.</p>
    <div class="row">
      <button class="btn" id="play">▶ Watch how it works</button>
      <div class="len">45 seconds · or <a href="#" id="posterSkip" style="color:var(--accent-ink);font-weight:700">skip to sign in</a></div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="top">
    <div class="bars" id="bars"></div>
    <button class="ic" id="mute" aria-label="Mute the voice-over" title="Mute">🔊</button>
    <button class="skip" id="skip">Skip</button>
  </div>

  <div class="mid">
    <div class="stage">
      <div class="scene" id="scene">
        <div class="scene-bg" id="sceneBg"></div>
      </div>
      <div class="cap"><span class="who" id="capWho">—</span><span class="txt dv" id="capTxt"></span></div>
    </div>
    <div class="say">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 class="serif" id="head"></h1>
    </div>
  </div>

  <div class="bottom">
    <button class="btn" id="cta">Next</button>
    <div class="tapnote" id="tapnote"></div>
  </div>
</div>

<script>
var $ = function(id){ return document.getElementById(id); };
var LOGIN = 'login.html';
var SEEN_KEY = 'samvaad.introSeen';
var BACKEND = (function(){ try{ return localStorage.getItem('samvaad.beUrl'); }catch(e){ return null; } })()
              || 'https://samvaad-backend-gyk9.onrender.com';

/* ---------------------------------------------------------------------------
   Measurement. The question the intro has to answer is not "did we ship it" but
   "does anyone watch it, and does the voice reach them". So: one anonymous id per
   browser, an event when it starts, one per scene, and one when they leave —
   sent with sendBeacon so a skip that navigates away still gets counted.
--------------------------------------------------------------------------- */
var ANON = (function(){
  try{
    var k='samvaad.anon', v=localStorage.getItem(k);
    if(!v){ v='a_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); localStorage.setItem(k,v); }
    return v;
  }catch(e){ return 'a_nostore'; }
})();
var T0 = Date.now();
function track(name, props, beacon){
  var body = JSON.stringify({ name: name, anonId: ANON, props: props || {} });
  try{
    if(beacon && navigator.sendBeacon){
      navigator.sendBeacon(BACKEND + '/api/event', new Blob([body], { type: 'application/json' }));
      return;
    }
    fetch(BACKEND + '/api/event', { method:'POST', headers:{'content-type':'application/json'}, body: body, keepalive: true }).catch(function(){});
  }catch(e){}
}
var elapsed = function(){ return Math.round((Date.now() - T0) / 100) / 10; };

/* ---------------------------------------------------------------------------
   The film. Each scene is one narration file, one speaker, and the expression the
   pair wear while it plays. `dur` is the measured length of the mp3 and is only a
   fallback — the real clock is the audio element's own currentTime.
--------------------------------------------------------------------------- */
var RIVE_SRC = { female:'rive/samvaad_female.riv', male:'rive/samvaad_male.riv' };
var EXPR_NUM = { neutral:0, attentive:1, tense:3, sad:4, happy:5, warm:8, sorry:8 };

var SCENES = [
  { audio:'audio/intro/01-f.mp3', dur:6.13, who:'f', name:'Meera',
    expr:{ a:'sad', b:'sad' },
    eyebrow:'Samvaad', h:'Every couple has that one conversation',
    line:'Every couple has that one conversation. The one that went sideways, and neither of you is quite sure where.' },
  { audio:'audio/intro/02-m.mp3', dur:8.96, who:'m', name:'Aarav',
    expr:{ a:'attentive', b:'neutral' },
    eyebrow:'Bring it in', h:'Paste the chat, or upload the recording',
    line:'That is where Samvaad starts. Paste the chat, or upload the recording. Hinglish, Hindi, English, it reads all of them.' },
  { audio:'audio/intro/03-f.mp3', dur:9.52, who:'f', name:'Meera',
    expr:{ a:'warm', b:'attentive' },
    eyebrow:'Watch it back', h:'The moment, in your own words',
    line:'And then it does the thing I did not expect. It plays the moment back to you, in your own words, acted out. You see it from the outside for the first time.' },
  { audio:'audio/intro/04-m.mp3', dur:9.20, who:'m', name:'Aarav',
    expr:{ a:'attentive', b:'warm' },
    eyebrow:'Say it differently', h:'The exact line, and a kinder one',
    line:'It is specific, too. Not just, you were harsh. It shows the exact line that turned it, and a kinder one you could actually say next time.' },
  { audio:'audio/intro/05-f.mp3', dur:5.90, who:'f', name:'Meera',
    expr:{ a:'warm', b:'attentive' },
    eyebrow:'When it is heated', h:'It breathes with you first',
    line:'If it got heated, it stops and breathes with you before anything else. Settle first, talk second.' },
  { audio:'audio/intro/06-m.mp3', dur:5.94, who:'m', name:'Aarav',
    expr:{ a:'happy', b:'happy' },
    eyebrow:'Your turn', h:'Shall we look at yours?',
    line:'One conversation, a few minutes, and you understand it differently. Shall we look at yours?',
    cta:'Get started' }
];

var i = 0, au = null, muted = false, timer = null, raf = 0, ended = false, audioOK = true;
var R = { a:null, b:null };

/* ---------- Rive: same wiring as the replay inside the app ---------- */
function riveReady(){ return typeof rive !== 'undefined' && rive && rive.Rive; }
function riveSet(ref, v){ try{ if(!ref) return; if(ref.input) ref.input.value = v; else if(ref.vm) ref.vm.value = v; }catch(e){} }
function riveResolve(inst, sm, name){
  try{ var ins = inst.stateMachineInputs(sm); if(ins) for(var n=0;n<ins.length;n++) if(ins[n].name===name) return { input: ins[n] }; }catch(e){}
  try{ var vmi = inst.viewModelInstance; if(vmi){ var num = vmi.number(name); if(num) return { vm: num }; } }catch(e){}
  return null;
}
function mountRigs(){
  $('scene').insertAdjacentHTML('beforeend',
      '<div class="ch a" id="ch-a"><canvas class="rvc" id="rv-a" width="256" height="340"></canvas></div>'
    + '<div class="ch b" id="ch-b"><canvas class="rvc flip" id="rv-b" width="256" height="340"></canvas></div>');
  if(!riveReady()) return;
  ['a','b'].forEach(function(side){
    var gender = side === 'a' ? 'female' : 'male';
    try{
      var lay; try{ lay = new rive.Layout({ fit: rive.Fit.Cover, alignment: rive.Alignment.BottomCenter }); }catch(e){ lay = undefined; }
      var inst = new rive.Rive({
        src: RIVE_SRC[gender], canvas: document.getElementById('rv-'+side), artboard:'Artboard', layout: lay,
        stateMachines:['Expression','mouthOps'], autoplay:true, autoBind:true,
        onLoad: function(){
          try{ inst.resizeDrawingSurfaceToCanvas(); }catch(e){}
          R[side] = { rive: inst, exp: riveResolve(inst,'Expression','expNum'), ph: riveResolve(inst,'mouthOps','phonemeNum'), ready:true };
          riveSet(R[side].exp, 0); riveSet(R[side].ph, 0);
        },
        onLoadError: function(){ R[side] = null; }
      });
    }catch(e){ R[side] = null; }
  });
}
function setExpr(side, emo){ var r = R[side]; if(r && r.ready) riveSet(r.exp, EXPR_NUM[emo] === undefined ? 0 : EXPR_NUM[emo]); }

/* ---------- lip-sync: the narration's own loudness drives the mouth ---------- */
var LS = { ctx:null, an:null, src:null, buf:null, raf:0, side:null };
function lipStart(side, audioEl){
  lipStop();
  LS.side = side;
  var Ctx = window.AudioContext || window.webkitAudioContext;
  if(!Ctx || !audioEl) return flap(side);
  try{
    var ctx = LS.ctx || (LS.ctx = new Ctx()); if(ctx.state === 'suspended') ctx.resume();
    var src = audioEl.__svSrc || (audioEl.__svSrc = ctx.createMediaElementSource(audioEl));
    var an = ctx.createAnalyser(); an.fftSize = 256;
    src.connect(an); an.connect(ctx.destination);
    LS.an = an; LS.src = src; LS.buf = new Uint8Array(an.frequencyBinCount);
    var frame = 0, hold = 0;
    var loop = function(){
      if(LS.side !== side || !LS.an) return;
      LS.an.getByteTimeDomainData(LS.buf);
      var s = 0, b = LS.buf; for(var n=0;n<b.length;n++){ var v = (b[n]-128)/128; s += v*v; }
      var rms = Math.sqrt(s/b.length);
      if(frame >= hold){
        var p, pool;
        if(rms < 0.035) p = 0;
        else { pool = rms < 0.09 ? [1,4,1,0] : rms < 0.17 ? [1,3,2,1] : [3,2,3,4]; p = pool[(Math.random()*pool.length)|0]; }
        var r = R[side]; if(r && r.ready) riveSet(r.ph, p);
        frame = 0; hold = 4 + ((Math.random()*4)|0);
      }
      frame++; LS.raf = requestAnimationFrame(loop);
    };
    loop();
  }catch(e){ flap(side); }
}
/* no audio (muted, or the browser refused): still move the mouth so nobody looks frozen */
function flap(side){
  var tick = function(){
    if(LS.side !== side) return;
    var r = R[side], pool = [1,3,2,1,4,3,0,0];
    if(r && r.ready) riveSet(r.ph, pool[(Math.random()*pool.length)|0]);
    LS.flap = setTimeout(tick, 80 + ((Math.random()*90)|0));
  };
  tick();
}
function lipStop(){
  if(LS.raf) cancelAnimationFrame(LS.raf); LS.raf = 0;
  if(LS.flap) clearTimeout(LS.flap); LS.flap = 0;
  if(LS.src){ try{ LS.src.disconnect(); }catch(e){} } LS.src = null;
  if(LS.an){ try{ LS.an.disconnect(); }catch(e){} } LS.an = null;
  if(LS.side){ var r = R[LS.side]; if(r && r.ready) riveSet(r.ph, 0); }
  LS.side = null;
}

/* ---------- the room behind them ---------- */
function sceneBg(){
  return '<svg viewBox="0 0 1000 480" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">'
    + '<defs>'
    + '<linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F9F1E8"/><stop offset="1" stop-color="#F2E2D6"/></linearGradient>'
    + '<linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EAD4C3"/><stop offset="1" stop-color="#DEC2AD"/></linearGradient>'
    + '<radialGradient id="g" cx="24%" cy="22%" r="58%"><stop offset="0" stop-color="#FFE9C6" stop-opacity=".5"/><stop offset="1" stop-color="#FFE9C6" stop-opacity="0"/></radialGradient>'
    + '</defs>'
    + '<rect width="1000" height="480" fill="url(#w)"/><rect width="1000" height="480" fill="url(#g)"/>'
    + '<rect y="356" width="1000" height="124" fill="url(#f)"/><rect y="354" width="1000" height="3" fill="rgba(255,255,255,.35)"/>'
    + '<ellipse cx="500" cy="440" rx="372" ry="44" fill="#F8DDE0" opacity=".55"/>'
    + '<rect x="86" y="52" width="132" height="100" rx="10" fill="#FCF5EC"/><rect x="95" y="61" width="114" height="82" rx="6" fill="#FDEFD6"/>'
    + '<line x1="152" y1="61" x2="152" y2="143" stroke="#FCF5EC" stroke-width="6"/><line x1="95" y1="102" x2="209" y2="102" stroke="#FCF5EC" stroke-width="6"/>'
    + '<rect x="712" y="98" width="108" height="128" rx="4" fill="#8A6B57"/><rect x="720" y="106" width="92" height="112" rx="2" fill="#F5E9DF"/>'
    + '<path d="M736 194 Q754 150 770 194" fill="none" stroke="#C8324B" stroke-width="2.4" opacity=".45"/>'
    + '<g transform="translate(872,300)"><ellipse cx="-13" cy="-38" rx="11" ry="32" fill="#7FA07E" transform="rotate(-18 -13 -38)"/>'
    + '<ellipse cx="6" cy="-50" rx="11" ry="36" fill="#6F9A79"/><ellipse cx="25" cy="-38" rx="11" ry="32" fill="#A6C39E" transform="rotate(18 25 -38)"/>'
    + '<path d="M-19 0 h42 l-7 52 h-28 z" fill="#CE9A78"/></g>'
    + '</svg>';
}

/* ---------- playback ---------- */
function bars(){
  $('bars').innerHTML = SCENES.map(function(_, n){
    return '<i><b style="transform:scaleX('+(n < i ? 1 : 0)+')"></b></i>';
  }).join('');
}
function progress(p){
  var b = $('bars').children[i]; if(b && b.firstChild) b.firstChild.style.transform = 'scaleX('+Math.max(0, Math.min(1, p))+')';
}

function renderScene(){
  var s = SCENES[i];
  $('eyebrow').textContent = s.eyebrow;
  $('head').textContent = s.h;
  $('head').className = 'serif anim';
  $('capWho').textContent = s.name;
  $('capTxt').textContent = s.line;
  $('cta').textContent = s.cta || 'Next';
  $('tapnote').textContent = s.cta ? '' : 'Skip ahead any time';
  var speaker = s.who === 'f' ? 'a' : 'b';
  setExpr('a', s.expr.a); setExpr('b', s.expr.b);
  $('ch-a').classList.toggle('idle', speaker !== 'a');
  $('ch-b').classList.toggle('idle', speaker !== 'b');
  bars();
  track('intro_scene', { scene: i + 1, at: elapsed() });
  playScene(speaker, s);
}

function playScene(speaker, s){
  stopAudio();
  var done = function(){ next(); };
  if(muted || !audioOK){
    lipStart(speaker, null);
    var start = Date.now();
    var tick = function(){ progress((Date.now()-start)/(s.dur*1000)); raf = requestAnimationFrame(tick); };
    tick();
    timer = setTimeout(function(){ lipStop(); done(); }, s.dur * 1000);
    return;
  }
  au = new Audio(s.audio);
  au.preload = 'auto';
  au.onended = function(){ lipStop(); done(); };
  au.onerror = function(){ audioOK = false; track('intro_audio_blocked', { scene: i+1, reason: 'load' }); lipStop(); playScene(speaker, s); };
  au.ontimeupdate = function(){ if(au.duration) progress(au.currentTime / au.duration); };
  lipStart(speaker, au);
  var p = au.play();
  if(p && p.catch) p.catch(function(){
    // The browser refused. Fall back to a silent, timed run rather than a frozen screen.
    audioOK = false;
    track('intro_audio_blocked', { scene: i + 1, reason: 'autoplay' });
    $('mute').textContent = '🔇';
    lipStop(); playScene(speaker, s);
  });
}
function stopAudio(){
  if(timer){ clearTimeout(timer); timer = null; }
  if(raf){ cancelAnimationFrame(raf); raf = 0; }
  if(au){ try{ au.pause(); }catch(e){} au.onended = au.onerror = au.ontimeupdate = null; au = null; }
  lipStop();
}

function next(){
  if(i >= SCENES.length - 1) return finish('completed');
  progress(1); i++; renderScene();
}
function finish(how){
  if(ended) return; ended = true;
  stopAudio();
  try{ localStorage.setItem(SEEN_KEY, '1'); }catch(e){}
  if(how === 'completed') track('intro_completed', { at: elapsed(), audio: audioOK && !muted }, true);
  else track('intro_skipped', { scene: i + 1, at: elapsed(), audio: audioOK && !muted }, true);
  location.replace(LOGIN);
}

/* ---------- controls ---------- */
$('cta').onclick = function(){ SCENES[i].cta ? finish('completed') : next(); };
$('skip').onclick = function(){ finish('skipped'); };
$('posterSkip').onclick = function(e){ e.preventDefault(); ended = true; try{ localStorage.setItem(SEEN_KEY,'1'); }catch(e2){}
  track('intro_skipped', { scene: 0, at: elapsed(), audio: false }, true); location.replace(LOGIN); };
$('mute').onclick = function(){
  muted = !muted;
  $('mute').textContent = muted ? '🔇' : '🔊';
  track('intro_muted', { scene: i + 1, muted: muted });
  if(au) au.muted = muted;
  if(muted && au){ /* keep the film moving on the audio clock we already have */ }
};
document.addEventListener('keydown', function(e){
  if($('poster').style.display === 'none'){
    if(e.key === 'Escape') finish('skipped');
    else if(e.key === 'ArrowRight'){ e.preventDefault(); next(); }
  }
});
// A skip that navigates away should still be counted.
window.addEventListener('pagehide', function(){ if(!ended) track('intro_skipped', { scene: i+1, at: elapsed(), audio: audioOK && !muted, closed: true }, true); });

/* ---------- boot ---------- */
$('play').onclick = function(){
  $('poster').style.display = 'none';
  track('intro_started', { at: elapsed() });
  i = 0; renderScene();
};

var FILM = /[?&]film=1/.test(location.search);

(function boot(){
  if(FILM) document.body.classList.add('film');
  $('sceneBg').innerHTML = sceneBg();
  mountRigs();
  bars();
  // Film mode records the export and answers to nobody: no poster, no admin switch, straight in.
  if(FILM){
    // give the rigs a moment to finish loading so frame one is never an empty room
    var waited = 0;
    (function ready(){
      if((R.a && R.a.ready && R.b && R.b.ready) || waited > 6000){
        $('poster').style.display = 'none'; i = 0; renderScene(); return;
      }
      waited += 120; setTimeout(ready, 120);
    })();
    return;
  }
  // Otherwise: if the admin has switched the intro off, never show it. Short leash, because a
  // sleeping Render instance must not hold a first-time visitor on a blank screen.
  var settled = false, go = function(){ settled = true; };
  var t = setTimeout(go, 700);
  fetch(BACKEND + '/api/config')
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){
      clearTimeout(t);
      if(d && d.introEnabled === false){
        try{ localStorage.setItem(SEEN_KEY, '1'); }catch(e){}
        location.replace(LOGIN); return;
      }
      go();
    })
    .catch(function(){ clearTimeout(t); go(); });
})();
</script>
</body>
</html>
